name: Update Stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Calculate
        run: |
          # Home Assistant analytics only counts opt-in installations: x4 gives an estimate
          DATA=$(curl -s https://analytics.home-assistant.io/custom_integrations.json)
          REAL_COUNT=$(echo "$DATA" | jq '.house_view.total // 0')
          ESTIMATED_COUNT=$((REAL_COUNT * 4))
          mkdir -p ./badges
          echo "{\"estimated\": $ESTIMATED_COUNT}" > ./badges/stats.json

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f ./badges/stats.json
          git commit -m "Update estimated stats" || exit 0
          git push
