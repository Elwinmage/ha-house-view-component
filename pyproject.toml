[tool.ruff]
target-version = "py313"
line-length = 120
# copies written by the sync_client.py of their repositories, checked there: the catalog client
# (reeftech-catalog/client) and the description of the house catalog (house-catalog/client)
extend-exclude = [
  "card/node_modules",
  "custom_components/house_view/catalog_pack.py",
  "custom_components/house_view/catalog_runtime.py",
  "custom_components/house_view/house_catalog_sections.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "C4", "PIE", "RUF", "PT", "PL"]
ignore = [
  "PLR2004", # magic values in comparisons: validation bounds are clearer inline
  "PLR0911", # several returns in HTTP handlers are intended
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913", "PLR0915", "PT011"] # PT011: the validators raise ValueError with varied messages
"scripts/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=custom_components.house_view --cov=scripts --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-report=html:reports/htmlcov --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["custom_components/house_view", "scripts"]
# the catalog client is tested at 100 % in reeftech-catalog, where it lives
omit = ["*/catalog_pack.py", "*/catalog_runtime.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
